<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>Retro Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css?v=20260901-8" onerror="this.onerror=null;this.href='./assets/css/style.css?v=20260901-8'">
</head>
<body>
  <script>
    // Remove legacy COI service workers from older Retro Vault builds.
    (() => {
      try {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const registration of registrations) {
              const url = registration.active?.scriptURL || registration.waiting?.scriptURL || registration.installing?.scriptURL || "";
              if (url.includes("coi-sw.js")) registration.unregister();
            }
          }).catch(() => {});
        }
      } catch (_) {}
    })();
  </script>
  <div id="boot-probe" style="position:fixed;z-index:99999;left:12px;bottom:12px;max-width:calc(100vw - 24px);padding:10px 12px;background:#111;color:#fff;border:1px solid #444;font:12px/1.4 ui-monospace,monospace">LOADING RETRO VAULT…</div>
  <header class="site-header">
    <div class="logo">RETRO VAULT</div>
    <div class="subtitle">INSERT COIN TO PLAY</div>
  </header>

  <main>
    <section id="toolbar" class="toolbar" aria-label="Game filters and emulator settings">
      <label class="search-wrap" for="search">
        <span class="sr-only">Search games</span>
        <input id="search" type="search" placeholder="SEARCH GAMES..." autocomplete="off" spellcheck="false">
      </label>

      <div id="core-filters" class="core-filters" aria-label="System filters">
        <button class="filter-btn active" type="button" data-core="all">ALL</button>
      </div>

      <div class="thread-control">
        <label class="switch-row" for="threads-toggle">
          <input id="threads-toggle" type="checkbox" checked>
          <span class="switch" aria-hidden="true"></span>
          <span>THREADS</span>
        </label>
        <span id="threads-status" class="thread-status">CHECKING...</span>
      </div>

      <button id="local-rom-btn" class="local-rom-btn" type="button">OPEN LOCAL ROM</button>
      <input id="local-rom-input" class="sr-only" type="file" autocomplete="off">
    </section>

    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <div id="loading" class="loading">LOADING GAME LIST...</div>
    <section id="game-grid" class="game-grid" aria-label="Games"></section>

    <section id="empty-state" class="empty-state" hidden>
      <div>NO GAMES FOUND</div>
      <div class="empty-subtitle">Try another search or system filter.</div>
    </section>

    <div id="stats" class="stats" aria-live="polite"></div>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <div class="modal-heading">
          <div id="modal-title" class="modal-title">-</div>
          <div id="modal-meta" class="modal-meta"></div>
        </div>
        <button id="close-btn" class="close-btn" type="button">CLOSE</button>
      </div>

      <div class="emulator-wrap">
        <iframe
          id="emulator-frame"
          title="Emulator"
          allow="autoplay; fullscreen; gamepad"
          allowfullscreen
          referrerpolicy="same-origin"
        ></iframe>
      </div>
    </div>
  </div>

  <div id="core-picker" class="core-picker" aria-hidden="true">
    <div class="core-picker-panel" role="dialog" aria-modal="true" aria-labelledby="core-picker-title">
      <div class="core-picker-kicker">LOCAL ROM</div>
      <div id="core-picker-title" class="core-picker-title">SELECT SYSTEM</div>
      <div id="core-picker-file" class="core-picker-file"></div>
      <div id="core-picker-help" class="core-picker-help"></div>
      <label class="core-picker-label" for="core-picker-select">SYSTEM / CORE</label>
      <select id="core-picker-select" class="core-picker-select"></select>
      <div class="core-picker-actions">
        <button id="core-picker-cancel" class="picker-btn secondary" type="button">CANCEL</button>
        <button id="core-picker-play" class="picker-btn primary" type="button">PLAY</button>
      </div>
    </div>
  </div>

  <footer>
    POWERED BY <span>EMULATORJS</span>
  </footer>

  <script>
    (() => {
      const probe = document.getElementById("boot-probe");
      const showBootError = message => {
        if (!probe) return;
        probe.textContent = message;
        probe.style.background = "#2a0d14";
        probe.style.borderColor = "#ff5d72";
        probe.style.color = "#fff";
      };

      window.addEventListener("error", event => {
        if (event.filename && event.filename.includes("app.js")) {
          showBootError(`APP ERROR: ${event.message || "Unknown JavaScript error"}`);
        }
      });

      window.addEventListener("unhandledrejection", event => {
        const reason = event.reason instanceof Error ? event.reason.message : String(event.reason || "Unknown promise rejection");
        showBootError(`APP PROMISE ERROR: ${reason}`);
      });

      const sources = [
        "/assets/js/app.js?v=20260901-8",
        "./assets/js/app.js?v=20260901-8"
      ];

      const load = index => {
        if (index >= sources.length) {
          showBootError(`APP.JS FAILED TO LOAD · PATH: ${location.pathname}`);
          return;
        }
        const script = document.createElement("script");
        script.src = sources[index];
        script.async = false;
        script.onerror = () => {
          script.remove();
          load(index + 1);
        };
        document.body.appendChild(script);
      };

      load(0);
    })();
  </script>
</body>
</html>
